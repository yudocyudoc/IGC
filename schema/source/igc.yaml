{
  "id": "https://w3id.org/igc/schema/0.1.1",
  "name": "igc",
  "title": "IGC Core Knowledge and Ledger Schema",
  "description": "Additive F1a ledger and FM-A molecular contract. JSON is valid YAML; LinkML generates the checked-in JSON Schema from this source.",
  "prefixes": {
    "igc": "https://w3id.org/igc/",
    "linkml": "https://w3id.org/linkml/",
    "xsd": "http://www.w3.org/2001/XMLSchema#"
  },
  "default_prefix": "igc",
  "default_range": "string",
  "imports": [
    "linkml:types"
  ],
  "classes": {
    "EntityRevision": {
      "description": "Immutable revision of a domain entity, recorded by one ledger event.",
      "slots": [
        "id",
        "entity_type",
        "schema_version",
        "case_id",
        "revision",
        "created_at",
        "created_by",
        "recorded_at",
        "source_event_id",
        "access_policy",
        "integrity_hash",
        "valid_from",
        "valid_to",
        "supersedes_revision",
        "payload"
      ]
    },
    "ClaimOccurrence": {
      "is_a": "EntityRevision",
      "description": "A source-grounded occurrence of a claim; it does not assert truth of proposition content."
    },
    "Proposition": {
      "is_a": "EntityRevision",
      "description": "Normalized propositional content, kept distinct from its source occurrence."
    },
    "Observation": {
      "is_a": "EntityRevision",
      "description": "An observation record with separate valid time and recorded time."
    },
    "Assumption": {
      "is_a": "EntityRevision",
      "description": "Revisable assumption with scope and provenance."
    },
    "KnowledgeEvent": {
      "description": "Append-only command/event envelope recorded atomically with an entity revision.",
      "slots": [
        "event_id",
        "case_id",
        "event_type",
        "actor_id",
        "idempotency_key",
        "occurred_at",
        "recorded_at",
        "schema_version",
        "payload_hash",
        "payload"
      ]
    },
    "MoleculeDefinition": {
      "description": "Versioned molecular contract; source presence does not imply runtime admission.",
      "slots": ["id", "version", "maturity", "modelica_class", "source_ref", "source_commit", "source_sha256", "license_status", "ports", "parameters"]
    },
    "MoleculePort": {
      "description": "Typed and directed interface port for a molecular definition.",
      "slots": ["port_id", "name", "direction", "signal_kind", "semantic_type", "unit"]
    },
    "ParameterSpecification": {
      "description": "Declared numeric bounds and unit for a molecule parameter.",
      "slots": ["parameter_id", "unit", "minimum", "maximum"]
    },
    "ConceptualModelRequest": {
      "description": "Structured model-building request; it does not assert an empirically true mechanism.",
      "slots": ["id", "description", "entity_type", "origin_refs", "unresolved"]
    },
    "ParameterBinding": {
      "description": "A parameter value with unit and optional supporting assumption reference.",
      "slots": ["parameter_id", "value", "unit", "assumption_ref"]
    },
    "MoleculeInstance": {
      "description": "One version-pinned instance of an admitted or explicitly partial molecule.",
      "slots": ["id", "molecule_definition_id", "parameter_bindings"]
    },
    "StructureConnection": {
      "description": "Directed connection between two declared molecule ports.",
      "slots": ["id", "from_port", "to_port", "connection_kind"]
    },
    "SystemStructureRevision": {
      "description": "Immutable topology revision, separately hashed from parameter values.",
      "slots": ["id", "catalog_snapshot", "molecule_instances", "connections", "structural_hash"]
    },
    "SystemModelCandidate": {
      "description": "A candidate model retaining its request, structure, assumptions and provenance.",
      "slots": ["id", "request_id", "structure_revision_id", "status", "assumption_refs", "origin_refs"]
    },
    "CandidateRelation": {
      "description": "Explicit relation between candidates; it does not select a winner.",
      "slots": ["id", "source_candidate_id", "target_candidate_id", "relation_type"]
    },
    "StructuralValidation": {
      "description": "Versioned structural-linter result, distinct from empirical support.",
      "slots": ["id", "candidate_id", "status", "validator_version", "issues"]
    },
    "SimulationRun": {
      "description": "Reproducible simulation record bound to one candidate revision and its artifacts.",
      "slots": ["id", "candidate_id", "solver", "status", "input_hash", "output_hash", "artifact_refs"]
    }
  },
  "slots": {
    "id": {
      "identifier": true,
      "range": "uriorcurie",
      "required": true
    },
    "entity_type": {
      "range": "string",
      "required": true
    },
    "schema_version": {
      "range": "string",
      "required": true
    },
    "case_id": {
      "range": "uriorcurie",
      "required": true
    },
    "revision": {
      "range": "integer",
      "required": true
    },
    "created_at": {
      "range": "datetime",
      "required": true
    },
    "created_by": {
      "range": "uriorcurie",
      "required": true
    },
    "recorded_at": {
      "range": "datetime",
      "required": true,
      "description": "System time at which the ledger accepted this revision."
    },
    "source_event_id": {
      "range": "uriorcurie",
      "required": true
    },
    "access_policy": {
      "range": "string",
      "required": true
    },
    "integrity_hash": {
      "range": "string",
      "required": true
    },
    "valid_from": {
      "range": "datetime"
    },
    "valid_to": {
      "range": "datetime"
    },
    "supersedes_revision": {
      "range": "integer"
    },
    "payload": {
      "range": "string",
      "required": true,
      "description": "Canonical JSON object serialized as text."
    },
    "event_id": {
      "identifier": true,
      "range": "uriorcurie",
      "required": true
    },
    "event_type": {
      "range": "string",
      "required": true
    },
    "actor_id": {
      "range": "uriorcurie",
      "required": true
    },
    "idempotency_key": {
      "range": "string",
      "required": true
    },
    "occurred_at": {
      "range": "datetime"
    },
    "payload_hash": {
      "range": "string",
      "required": true
    },
    "version": {"range": "string", "required": true},
    "maturity": {"range": "string", "required": true},
    "modelica_class": {"range": "string"},
    "source_ref": {"range": "uriorcurie"},
    "source_commit": {"range": "string"},
    "source_sha256": {"range": "string"},
    "license_status": {"range": "string", "required": true},
    "ports": {"range": "MoleculePort", "multivalued": true, "inlined": true, "inlined_as_list": true, "required": true},
    "parameters": {"range": "ParameterSpecification", "multivalued": true, "inlined": true, "inlined_as_list": true},
    "port_id": {"identifier": true, "range": "string", "required": true},
    "name": {"range": "string", "required": true},
    "direction": {"range": "string", "required": true},
    "signal_kind": {"range": "string", "required": true},
    "semantic_type": {"range": "string", "required": true},
    "unit": {"range": "string", "required": true},
    "parameter_id": {"identifier": true, "range": "string", "required": true},
    "minimum": {"range": "float"},
    "maximum": {"range": "float"},
    "description": {"range": "string", "required": true},
    "origin_refs": {"range": "uriorcurie", "multivalued": true},
    "unresolved": {"range": "string", "multivalued": true},
    "value": {"range": "float", "required": true},
    "assumption_ref": {"range": "uriorcurie"},
    "molecule_definition_id": {"range": "uriorcurie", "required": true},
    "parameter_bindings": {"range": "ParameterBinding", "multivalued": true, "inlined": true, "inlined_as_list": true},
    "from_port": {"range": "string", "required": true},
    "to_port": {"range": "string", "required": true},
    "connection_kind": {"range": "string", "required": true},
    "catalog_snapshot": {"range": "string", "required": true},
    "molecule_instances": {"range": "MoleculeInstance", "multivalued": true, "inlined": true, "inlined_as_list": true, "required": true},
    "connections": {"range": "StructureConnection", "multivalued": true, "inlined": true, "inlined_as_list": true},
    "structural_hash": {"range": "string", "required": true},
    "request_id": {"range": "uriorcurie", "required": true},
    "structure_revision_id": {"range": "uriorcurie", "required": true},
    "status": {"range": "string", "required": true},
    "assumption_refs": {"range": "uriorcurie", "multivalued": true},
    "source_candidate_id": {"range": "uriorcurie", "required": true},
    "target_candidate_id": {"range": "uriorcurie", "required": true},
    "relation_type": {"range": "string", "required": true},
    "candidate_id": {"range": "uriorcurie", "required": true},
    "validator_version": {"range": "string", "required": true},
    "issues": {"range": "string", "multivalued": true},
    "solver": {"range": "string", "required": true},
    "input_hash": {"range": "string", "required": true},
    "output_hash": {"range": "string"},
    "artifact_refs": {"range": "uriorcurie", "multivalued": true}
  }
}
