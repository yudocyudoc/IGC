name: R2 Buffalo input preflight
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: arena-r2-pt01-three-private-packages-authenticated
          run-id: 40479578291
          github-token: ${{ github.token }}
          path: artifacts/r2-pt01
      - name: Fetch unchanged Buffalo engine
        run: |
          mkdir -p upstream/sd-ai
          cd upstream/sd-ai
          git init -q
          git remote add origin https://github.com/UB-IAD/sd-ai.git
          git fetch --depth 1 origin 5199f7b45f3a7ae4a773cb0dd8542940aabe9edc
          git checkout --detach FETCH_HEAD
          npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install model tokenizer only, never model weights
        run: python -m pip install 'tokenizers==0.22.1'
      - name: Offline preflight, no inference
        env:
          SDAI_ROOT: ${{ github.workspace }}/upstream/sd-ai
          BUFFALO_VISIBLE_INPUT: ${{ github.workspace }}/artifacts/r2-pt01/b-visible.json
          BUFFALO_PRIOR_OUTPUT: ${{ github.workspace }}/artifacts/r2-pt01/b-parent-native.json
          BUFFALO_R2_FEEDBACK: ${{ github.workspace }}/artifacts/r2-pt01/b-own-feedback.json
          BUFFALO_R2_EXTENDED: AUTHORIZED_16000_20261027
          BUFFALO_OUTPUT: ${{ github.workspace }}/artifacts/r2-b-preflight
          BUFFALO_CF_MODE: offline
        run: |
          node scripts/arena_b_openrouter_cloudflare.mjs
          node -e "const r=require('./artifacts/r2-b-preflight/receipt.json');console.log('R2_INPUT_BYTES',r.r2_input_utf8_bytes);console.log('R2_16K_REQUEST_SHA',r.request_sha256);if(!r.r2_extended_budget)process.exit(1);if(r.live_provider_calls!==0||!r.current_model_seen||!r.r2_feedback_seen)process.exit(1)"
      - name: Count exact GLM-5.3-Flash tokenizer units with conservative template allowance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.request import urlopen
          from tokenizers import Tokenizer
          url='https://huggingface.co/zai-org/GLM-5.3-Flash/resolve/main/tokenizer.json'
          model=Tokenizer.from_str(urlopen(url,timeout=75).read().decode())
          data=json.loads(Path('artifacts/r2-b-preflight/r2-upstream-tokenizer-input.json').read_text())
          msg=sum(len(model.encode(m['content'],add_special_tokens=False).ids)
                  for m in data['messages'])
          schema=len(model.encode(json.dumps(data['response_format'],separators=(',',':')),
                                  add_special_tokens=False).ids)
          allowance=256
          total=msg+schema+allowance
          print('GLM53_FLASH_MESSAGE_TOKENS',msg)
          print('GLM53_FLASH_SCHEMA_TOKENS',schema)
          print('GLM53_FLASH_ALLOWANCE',allowance)
          print('GLM53_FLASH_CONSERVATIVE_INPUT_TOKENS',total)
          assert total<=8000, 'R2_INPUT_EXCEEDS_AUTHORIZED_8000_TOKEN_BUDGET'
          PY
