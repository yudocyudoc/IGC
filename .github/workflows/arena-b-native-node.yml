name: Arena B native original quantitative engine
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arena-b-native-experiment
  cancel-in-progress: false
jobs:
  original-buffalo:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout exact original Buffalo commit
        run: |
          mkdir -p upstream/sd-ai
          cd upstream/sd-ai
          git init -q
          git remote add origin https://github.com/UB-IAD/sd-ai.git
          git fetch --depth 1 origin 5199f7b45f3a7ae4a773cb0dd8542940aabe9edc
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 5199f7b45f3a7ae4a773cb0dd8542940aabe9edc
          echo "UPSTREAM_PIN_VERIFIED"
      - name: Install upstream dependencies without unrelated postinstall
        working-directory: upstream/sd-ai
        run: npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Run unmodified original Engine.generate with mock schema response
        env:
          SDAI_ROOT: ${{ github.workspace }}/upstream/sd-ai
          BUFFALO_VISIBLE_INPUT: ${{ github.workspace }}/data/synthetic/arena_b_native_visible.json
          BUFFALO_OUTPUT: ${{ github.workspace }}/artifacts/buffalo-native-offline
          BUFFALO_MODE: mock
        run: |
          set -euo pipefail
          node scripts/arena_b_native_runner.mjs
          node - <<'JS'
          const fs=require("fs");
          const r=JSON.parse(fs.readFileSync("artifacts/buffalo-native-offline/receipt.json"));
          if(r.status!=="ORIGINAL_ENGINE_OFFLINE_PATH_PASS"||!r.quant_schema_seen||
             r.provider_calls!==0||r.proxy_requests!==1||
             !r.inferred_inflow_by_buffalo.includes("Arrivals")) throw Error("NATIVE_ENGINE_FAIL");
          console.log("ORIGINAL_QUANTITATIVE_ENGINE_WRAPPER_POSTPROCESS_PASS");
          JS
      - name: Check one-use authorizing marker in HEAD
        id: grant
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$GITHUB_RUN_ATTEMPT" = "1" ] &&
             [ "$GITHUB_HEAD_REF" = "feature/arena-b-native-node-engine-v01" ] &&
             git diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD |
             grep -Fxq data/diagnostics/BUFFALO_NATIVE_SINGLE_CALL.json; then
            node - <<'JS'
            const a=require("./data/diagnostics/BUFFALO_NATIVE_SINGLE_CALL.json");
            if(a.schema!=="igc-b-native-call/0.1"||a.max_calls!==1||a.retries!==0||
               a.model!=="@cf/zai-org/glm-5.3-flash"||a.no_other_arms!==true)
              throw Error("INVALID_AUTHORIZATION");
            JS
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "NO_SINGLE_CALL_MARKER_NO_PROVIDER_CALL"
          fi
      - name: Run real Cloudflare model through original Buffalo engine (one remote request)
        if: ${{ steps.grant.outputs.allowed == 'true' }}
        env:
          SDAI_ROOT: ${{ github.workspace }}/upstream/sd-ai
          BUFFALO_VISIBLE_INPUT: ${{ github.workspace }}/data/synthetic/arena_b_native_visible.json
          BUFFALO_OUTPUT: ${{ github.workspace }}/artifacts/buffalo-native-live
          BUFFALO_MODE: live
          BUFFALO_LIVE_AUTH: ONE_UPSTREAM_CALL
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/arena_b_native_runner.mjs
      - name: Preserve full native engine proof (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buffalo-native-node-engine-proof
          path: |
            artifacts/buffalo-native-offline/
            artifacts/buffalo-native-live/
          retention-days: 30
