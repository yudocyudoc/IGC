name: Arena Buffalo R2 16K -- one authorized experiment
on:
  push:
    branches: [experiment/arena-b-16000-20261027]
permissions:
  contents: read
  actions: read
concurrency:
  group: arena-buffalo-r2-16k-20261027
  cancel-in-progress: false
jobs:
  one_call:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          name: arena-r2-pt01-three-private-packages-authenticated
          run-id: 40479578291
          github-token: ${{ github.token }}
          path: artifacts/r2-pt01
      - name: Use unchanged pinned Buffalo upstream
        run: |
          set -euo pipefail
          mkdir -p upstream/sd-ai
          cd upstream/sd-ai
          git init -q
          git remote add origin https://github.com/UB-IAD/sd-ai.git
          git fetch --depth 1 origin 5199f7b45f3a7ae4a773cb0dd8542940aabe9edc
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 5199f7b45f3a7ae4a773cb0dd8542940aabe9edc
          npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Gate exactly one new consent-marker commit, never reruns
        id: permit
        run: |
          set -euo pipefail
          if [ "$GITHUB_RUN_ATTEMPT" != 1 ] || \
             ! git diff-tree --no-commit-id --name-only --diff-filter=A -r HEAD | \
             grep -Fxq data/diagnostics/BUFFALO_R2_16K_ONE_CALL_20261027.json; then
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          actual=json.loads(Path('data/diagnostics/BUFFALO_R2_16K_ONE_CALL_20261027.json').read_text())
          expected={
            'schema':'igc-buffalo-r2-16k-single-attempt/0.1',
            'model':'@cf/zai-org/glm-5.3-flash',
            'parent_native_sha256':'sha256:8097496d8033bfe8b5a93eeb7d391f7c98f6bb315bdfb9e63f62b6910b437eac',
            'source_snapshot_hash':'sha256:562204e3c4509718f8e9ce55d407477edc97bb4cbbcfc266ed50ca3777bd3c92',
            'request_sha256':'sha256:d0426c72a2b19856cb9d1a9ff5f6e322a7aaa8f31395ead032588065ba76ad4c',
            'input_tokens_max':8000,'output_tokens_max':16000,
            'http_timeout_seconds':360,'calls_max':1,'automatic_retries':0,
            'keep_original_prompt_schema_parent':True,'user_authorized':True}
          assert actual==expected, 'NEW_16K_CONSENT_MARKER_INVALID'
          PY
          echo 'allowed=true' >> "$GITHUB_OUTPUT"
      - name: Exactly one real original Buffalo 16K inference
        if: ${{ steps.permit.outputs.allowed == 'true' }}
        continue-on-error: true
        env:
          SDAI_ROOT: ${{ github.workspace }}/upstream/sd-ai
          BUFFALO_VISIBLE_INPUT: ${{ github.workspace }}/artifacts/r2-pt01/b-visible.json
          BUFFALO_PRIOR_OUTPUT: ${{ github.workspace }}/artifacts/r2-pt01/b-parent-native.json
          BUFFALO_R2_FEEDBACK: ${{ github.workspace }}/artifacts/r2-pt01/b-own-feedback.json
          BUFFALO_OUTPUT: ${{ github.workspace }}/artifacts/r2-b-real
          BUFFALO_R2_EXTENDED: AUTHORIZED_16000_20261027
          BUFFALO_CF_MODE: live
          BUFFALO_R2_AUTH: RUN_SINGLE_CF_AI_R2_16000_20261027
          BUFFALO_CF_AUTH: RUN_SINGLE_CF_AI_R2_16000_20261027
          BUFFALO_R2_EXPECTED_REQUEST_SHA: sha256:d0426c72a2b19856cb9d1a9ff5f6e322a7aaa8f31395ead032588065ba76ad4c
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/arena_b_openrouter_cloudflare.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.permit.outputs.allowed == 'true' }}
        with:
          name: buffalo-r2-16k-real-raw-before-evaluation
          path: artifacts/r2-b-real/
          retention-days: 60
      - name: G0 strict native translation or block
        id: g0
        if: ${{ steps.permit.outputs.allowed == 'true' }}
        run: |
          python -m scripts.arena_r2_b_16k_finish pre --visible artifacts/r2-pt01/b-visible.json --live artifacts/r2-b-real --physical artifacts/r2-b-physical
          if [ -s artifacts/r2-b-physical/check.mos ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; fi
      - name: Native OpenModelica G2, only after G0
        if: ${{ steps.g0.outputs.ready == 'true' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work/artifacts/r2-b-physical openmodelica/openmodelica:v1.27.1-minimal@sha256:ac9a0223e69b8055d444b42f58ccb9680342b56848c68b81385bf83d7c0ba824 omc check.mos 2>&1 | tee artifacts/r2-b-physical/omc.log
      - name: Normalize Docker permissions
        if: always()
        run: |
          if [ -d artifacts/r2-b-physical ]; then sudo chown -R "$(id -u):$(id -g)" artifacts/r2-b-physical; fi
      - name: Final report retaining negative outcomes
        if: ${{ steps.permit.outputs.allowed == 'true' }}
        run: |
          python -m scripts.arena_r2_b_16k_finish final --visible artifacts/r2-pt01/b-visible.json --live artifacts/r2-b-real --physical artifacts/r2-b-physical --out artifacts/r2-b-16k-outcome.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: buffalo-r2-16k-all-results
          path: |
            artifacts/r2-b-real/
            artifacts/r2-b-physical/
            artifacts/r2-b-16k-outcome.json
          retention-days: 60
