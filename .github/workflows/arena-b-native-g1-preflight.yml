name: Arena B native G1 preflight
on:
  push:
    branches: [feature/arena-b-native-g1-diagnostic]
  pull_request:
    branches: [feature/arena-b-native-node-engine-v01]
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check immutable G1 diagnostics and negative controls
        run: node --test tests/test_arena_b_native_g1_diagnostic.mjs
      - name: Diagnose handwritten fixture only (not generated by AI)
        run: |
          mkdir -p artifacts/g1-preflight
          node -e "const fs=require('fs'); const x=require('./data/synthetic/arena_b_native_visible.json'); fs.writeFileSync('artifacts/g1-preflight/visible-sha.json',JSON.stringify({schema:x.schema}))"
      - name: Preserve test summary
        if: always()
        run: echo "No external inference; no claims of OpenModelica execution or causal validation."
