name: F4 cafe — constructive rival bottlenecks, no grid or G4/G5
on:
  pull_request:
    paths:
      - 'scripts/arena_cafe/f4_rival_bottleneck_witness.py'
      - 'tests/test_arena_cafe_f4_rival_bottleneck_witness.py'
      - 'docs/arena_cafe/f4/00_DESARROLLO_RIVALES_CUELLOS.md'
      - '.github/workflows/arena-cafe-f4-rivals.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  physical-design-witness:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Use original known EV-01 public O0, no private physical truth
        uses: actions/download-artifact@v4
        with:
          name: a1-cafe-O0
          run-id: 41575917332
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/public
      - name: Construct exact witness with original DES and adversarial checks
        env:
          F4_O0: artifacts/public/O0_VISIBLE.json
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_arena_cafe_f4_rival_bottleneck_witness.py' -v
          python -m scripts.arena_cafe.f4_rival_bottleneck_witness \
            --o0 "$F4_O0" --out artifacts/F4_RIVAL_BOTTLENECKS_DEVELOPMENT.json
          python - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('artifacts/F4_RIVAL_BOTTLENECKS_DEVELOPMENT.json').read_text())
          assert r['S0_model_baselines']['PREP_SLOW_A']['delivered_cumulative']==[0,0,2,4,6,8]
          assert r['S0_model_baselines']['DISPATCH_SLOW_B']['delivered_cumulative']==[0,0,2,4,6,8]
          assert r['absolute_counterfactual_divergence_orders']>=3
          assert r['no_new_DES_or_parameter_grid_or_provider_or_PM']
          assert r['F5_new_independent_worlds']=='NOT_CREATED'
          assert r['A3']=='PARTIAL' and r['G4']==r['G5']=='NOT_RUN'
          assert not r['preregistered_future_experiment']
          print('F4_POS_EQUIVALENT_RIVALS_DIFFERENT_ONE_ACTION_DEVELOPMENT_ONLY')
          PY
      - name: Publish only public developmental hypotheses, no reserved world
        uses: actions/upload-artifact@v4
        with:
          name: f4-known-o0-constructive-rival-mechanism-witness
          path: artifacts/F4_RIVAL_BOTTLENECKS_DEVELOPMENT.json
          if-no-files-found: error
          retention-days: 90
