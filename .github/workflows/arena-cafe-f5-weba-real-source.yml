name: F5 WEBA — real one-shift POS/Tapo source readiness (no G5 inference)
on:
  pull_request:
    paths:
      - 'scripts/arena_cafe/weba_source_readiness.py'
      - 'tests/test_arena_cafe_weba_source_readiness.py'
      - 'scripts/arena_cafe/weba_temporal_windows.py'
      - 'tests/test_arena_cafe_weba_temporal_windows.py'
      - 'docs/arena_cafe/f5/03_WEBA_POS_TAPO_TEMPORAL_WINDOWS.md'
      - 'docs/arena_cafe/f5/02_WEBA_REAL_SOURCE_FIRST_PASS.md'
      - '.github/workflows/arena-cafe-f5-weba-real-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  one-real-shift-aggregate-source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source parser semantics without synthetic cafe worlds
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_arena_cafe_weba_source_readiness.py' -v
          python -m unittest discover -s tests -p 'test_arena_cafe_weba_temporal_windows.py' -v
      - name: Fetch ONLY pinned external POS and Tapo text (exclude participant/health)
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request,urlopen
          from scripts.arena_cafe import weba_source_readiness as w
          base=("https://raw.githubusercontent.com/"
                +w.UPSTREAM_REPO+"/"+w.UPSTREAM_COMMIT+"/")
          private=Path("artifacts/weba-private-source-do-not-upload")
          private.mkdir(parents=True,exist_ok=True)
          for name,meta in w.SOURCE_FILES.items():
              url=base+meta["path"]
              req=Request(url,headers={"User-Agent":"IGC-WEBA-source-readiness"})
              with urlopen(req,timeout=30) as response:
                  raw=response.read()
              info=w.verify_pinned(name,raw)
              (private/("orders.xlsx" if name=="pos" else "tapo.log")).write_bytes(raw)
              print(name,"PINNED_GIT_BLOB",info["git_blob_sha1"],
                    "bytes",info["bytes"])
          PY
      - name: Inspect real workbook and raw Tapo snapshot; publish aggregates ONLY
        run: |
          set -euo pipefail
          python -m scripts.arena_cafe.weba_source_readiness \
            --pos artifacts/weba-private-source-do-not-upload/orders.xlsx \
            --tapo artifacts/weba-private-source-do-not-upload/tapo.log \
            --out artifacts/F5_WEBA_REAL_ONE_SHIFT_SOURCE_READINESS.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path(
            "artifacts/F5_WEBA_REAL_ONE_SHIFT_SOURCE_READINESS.json").read_text())
          assert r["upstream_git_commit"]=="d6841669e544579547c94b7ce1e8613bbd6b3a39"
          assert r["tapo"]["sensor_count"]==10
          assert r["tapo"]["total_returned_tapo_events"]==911
          assert r["tapo"]["keepopen_events_retained"]==7
          assert r["tapo"]["returned_records_per_selected_sensor"]=={
              "front_door":161,"front_door_m":115,
              "zone_1":147,"zone_2":244}
          assert r["pos"]["source_has_order_id_field"]
          assert r["pos"]["total_nonempty_order_rows"]>0
          assert r["pos"]["raw_date_encoding_observed"]=="YYYYMMDD_FOR_THIS_PINNED_SOURCE"
          assert r["pos"]["number_of_rows_with_parseable_order_date"]==r["pos"]["total_nonempty_order_rows"]
          assert r["pos"]["total_nonempty_order_rows"]==588
          assert r["pos"]["number_of_distinct_date_tokens"]==28
          assert r["pos"]["rows_matching_selected_day"]==48
          assert r["pos"]["rows_matching_selected_evening_shift"]==33
          assert r["pos"]["selected_shift_rows_with_order_time"]==33
          assert r["raw_source_records_not_published"]
          assert r["participant_health_wearables_or_questionnaires_not_ingested"]
          assert not r["same_shift_pos_tapo_basic_presence_check"][
              "physical_stage_completion_per_order_identified"]
          assert r["eligible_as_independent_F5_dispatch_service_finish"]=="NO"
          assert r["G4"]==r["G5"]=="NOT_RUN"
          assert r["F5_reserve"]=="NOT_CREATED"
          def audit_public_keys(node):
              if isinstance(node,dict):
                  for key,value in node.items():
                      assert key not in {
                          "mac","ip","ssid","order_ID","case_id",
                          "device_id","event_id","resource_id",
                          "t_minutes_exact","raw_order_time"}
                      audit_public_keys(value)
              elif isinstance(node,list):
                  for item in node:
                      audit_public_keys(item)
          audit_public_keys(r)
          print("WEBA_REAL_SOURCE_AUDIT_PASS_NO_PER_ORDER_SERVICE_INFERENCE")
          PY
      - name: Compare pre-fixed half-hour bins under declared Budapest clock assumption
        run: |
          set -euo pipefail
          python -m scripts.arena_cafe.weba_temporal_windows \
            --pos artifacts/weba-private-source-do-not-upload/orders.xlsx \
            --tapo artifacts/weba-private-source-do-not-upload/tapo.log \
            --out artifacts/F5_WEBA_POS_TAPO_TEMPORAL_WINDOWS_DEVELOPMENT.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("artifacts/F5_WEBA_POS_TAPO_TEMPORAL_WINDOWS_DEVELOPMENT.json").read_text())
          assert r["schema"]=="igc-weba-pos-tapo-fixed-windows/0.1"
          assert r["pos_orders_selected"]==33
          assert r["number_of_bins"]==10 and r["window_minutes"]==30
          assert r["assumed_pos_clock_zone"]=="Europe/Budapest"
          assert r["POS_clock_timezone_from_raw_metadata_certified"] is False
          assert r["cross_clock_offset_calibrated"] is False
          assert len(r["sensor_rows_per_window_with_pos_assumed_local"])==10
          assert r["sensor_selected_event_totals"]=={
              "front_door":161,"front_door_m":115,
              "zone_1":147,"zone_2":244}
          pos_count=sum(v["pos_orders_assuming_Budapest_local_clock"] for v
                        in r["sensor_rows_per_window_with_pos_assumed_local"])
          assert pos_count+r["pos_orders_outside_primary_windows"]==33
          sensor_fields={
              "front_door":"tapo_front_door_contact_events",
              "front_door_m":"tapo_front_door_motion_events",
              "zone_1":"tapo_zone_1_motion_events",
              "zone_2":"tapo_zone_2_motion_events"}
          for sensor,field in sensor_fields.items():
              counted=sum(v[field] for v in r[
                  "sensor_rows_per_window_with_pos_assumed_local"])
              assert counted+r["sensor_outside_fixed_windows"][sensor]==r[
                  "sensor_selected_event_totals"][sensor]
          assert r["pos_orders_in_primary_windows"]==33
          assert r["pos_orders_outside_primary_windows"]==0
          assert r["pos_orders_in_UTC_as_written_sensitivity_windows"]==32
          assert r["pos_orders_outside_UTC_as_written_sensitivity_windows"]==1
          assert r["bins_with_at_least_one_pos_order_assuming_local"]==7
          assert r["bins_with_sensor_activity_but_zero_pos_orders_assuming_local"]==2
          assert r["bins_with_both_pos_and_sensor_pulse_assuming_local"]=={
              "front_door":7,"front_door_m":7,"zone_1":7,"zone_2":7}
          assert r["sensor_events_in_zero_pos_order_windows_assuming_local"]=={
              "front_door":27,"front_door_m":14,"zone_1":12,"zone_2":23}
          assert r["sensor_pulses_when_no_pos_orders_are_NOT_false_detections"]
          assert r["coactivity_does_NOT_validate_sensor_as_pos_order_proxy"]
          assert r["no_single_time_offset_optimized_for_correspondence"]
          assert r["no_pos_order_tapo_event_pairing_attempted"]
          assert r["no_causality_or_service_event_inferred"]
          assert r["health_participant_wearable_data_not_read"]
          assert r["G4"]==r["G5"]=="NOT_RUN"
          assert r["F5_reserve"]=="NOT_CREATED"
          def prohibit_raw(node):
              if isinstance(node,dict):
                  for k,v in node.items():
                      assert k not in {
                          "order_ID","case_id","device_id","mac",
                          "ip","ssid","event_id","resource_id",
                          "t_minutes_exact","raw_order_time"}
                      prohibit_raw(v)
              elif isinstance(node,list):
                  for v in node:
                      prohibit_raw(v)
          prohibit_raw(r)
          print("WEBA_FIXED_TIME_WINDOWS_DESCRIPTIVE_ONLY_NO_SENSOR_TO_ORDER_LINK")
          PY
      - name: Remove private source files before artifact upload
        if: always()
        run: |
          rm -rf artifacts/weba-private-source-do-not-upload
      - name: Upload only source digests and aggregate readiness, never raw source
        uses: actions/upload-artifact@v4
        with:
          name: f5-weba-real-one-shift-aggregate-readiness
          path: |
            artifacts/F5_WEBA_REAL_ONE_SHIFT_SOURCE_READINESS.json
            artifacts/F5_WEBA_POS_TAPO_TEMPORAL_WINDOWS_DEVELOPMENT.json
          if-no-files-found: error
          retention-days: 90
