name: F0-HIST — recovered EV01/EV02 + unchanged native engines
on:
  pull_request:
    paths:
      - 'scripts/arena_cafe/**'
      - 'scripts/arena_event_observability.py'
      - 'scripts/arena_operational_ingestion.py'
      - 'scripts/arena_physical/**'
      - 'experiments/arena_cafe/**'
      - 'tests/test_arena_native_provenance.py'
      - '.github/workflows/f0-cafe-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovered-events-and-native-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run original event-mining API with pinned dependency
        run: python -m pip install pm4py==2.7.23.11
      - name: Verify original native code, physical clone, and original recovered EV tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_arena_native_provenance.py' -v
          python -m unittest discover -s tests -p 'test_arena_physical_clone.py' -v
          python -m unittest discover -s experiments/arena_cafe -p 'test_*.py' -v
      - name: No dependency on archived CAF files in promoted modules
        run: |
          python - <<'PY'
          from pathlib import Path
          for file in (Path('scripts/arena_cafe').glob('*.py')):
              s=file.read_text()
              assert 'import caf07b_umbral_secuencial' not in s, file
              assert 'experiments.cafeteria.pc01' not in s, file
              assert 'import arena_ev01_event_views' not in s, file
          print('PROMOTED_MODULES_DO_NOT_IMPORT_ARCHIVED_CAF')
          PY
