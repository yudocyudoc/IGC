name: Arena PR171 cheap regressions - evidence causal input and ATMS
on:
  pull_request:
    paths:
      - 'scripts/arena_cafe/buffalo_ev01_visible.py'
      - 'scripts/arena_cafe/continuity_round.py'
      - 'scripts/arena_cafe/e03_cal_grid.py'
      - 'scripts/arena_cafe/e04_action_capability.py'
      - 'scripts/arena_cafe/e04_evaluator.py'
      - 'tests/test_arena_cafe_buffalo_ev01_visible.py'
      - 'tests/test_arena_cafe_e02_memory_bound.py'
      - 'tests/test_arena_cafe_e03_cal_grid.py'
      - 'tests/test_arena_cafe_e04_action.py'
      - '.github/workflows/arena-pr171-regressions.yml'
permissions:
  contents: read
  actions: read
jobs:
  cheap-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies of native adapters
        run: python -m pip install --disable-pip-version-check numpy scipy
      - name: Download historical public O0/O1
        uses: actions/download-artifact@v4
        with:
          name: a1-cafe-public-evidence
          run-id: 41575917332
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/public
      - name: Buffalo preflight on both conditions, zero provider
        env:
          E01_PUBLIC_DIR: artifacts/public
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_arena_cafe_buffalo_ev01_visible.py' -v
          python -m scripts.arena_cafe.buffalo_ev01_visible --input artifacts/public/O0_VISIBLE.json --condition O0 --out artifacts/b-stage-O0
          python -m scripts.arena_cafe.buffalo_ev01_visible --input artifacts/public/O1_VISIBLE.json --condition O1 --out artifacts/b-stage-O1
          python - <<'PY'
          import json
          from pathlib import Path
          a,b=[json.loads((Path('artifacts')/('b-stage-'+c)/'b-visible.json').read_text())
               for c in ('O0','O1')]
          sa=a['construction']['declared_input_reconstruction']
          sb=b['construction']['declared_input_reconstruction']
          assert sa==sb
          assert sa['mass_not_moved_before_event']
          assert sa['policy']=='CAUSAL_RIGHT_RECTANGULAR_EVENT_KERNEL/0.1'
          assert a['round_id']!=b['round_id']
          print('BUFFALO_TWO_CONDITIONS_SAME_CAUSAL_SOURCE_NO_PROVIDER')
          PY
      - name: Actual ATMS feedback dependence and rollback tests
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_arena_cafe_e02_memory_bound.py' -v
          python -m unittest discover -s tests -p 'test_arena_cafe_continuity_round.py' -v
      - name: Cheap E03 native source and fixed grid guards
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_arena_native_provenance.py' -v
          python - <<'PY'
          from scripts.arena_cafe import e03_cal_grid as e
          assert len(e.D_GRID['capacity_orders_min'])*len(e.D_GRID['response_minutes'])==9
          assert len(e.M_GRID['maxThroughput_orders_hour'])*len(e.M_GRID['responseTime_hours'])==9
          print('E03_STATIC_PARAMETER_BUDGET_CHECK_NO_OMC')
          PY
