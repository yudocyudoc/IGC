name: Arena V0.1 selective integration governance (no inference)
on:
  push:
    branches: [integration/arena-v0.1.0]
    paths:
      - 'docs/ARENA_V0_1_INTEGRACION_Y_VERSIONES_2026-10-26.md'
      - 'data/arena/v0.1-integration-sources.json'
      - 'tests/test_arena_v0_release_inventory.py'
      - '.github/workflows/arena-v0-release-governance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/ARENA_V0_1_INTEGRACION_Y_VERSIONES_2026-10-26.md'
      - 'data/arena/v0.1-integration-sources.json'
      - 'tests/test_arena_v0_release_inventory.py'
      - '.github/workflows/arena-v0-release-governance.yml'
permissions:
  contents: read
jobs:
  inventory-and-p0-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.16'
      - name: Compile and verify source inventory and no premature release
        run: |
          set -euo pipefail
          python -m py_compile tests/test_arena_v0_release_inventory.py
          python -m unittest discover -s tests -p 'test_arena_v0_release_inventory.py' -v
      - name: Preserve integrated P0 contract regression, offline
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_arena_v0_contract.py' -v
          echo 'P0+SOURCE_INVENTORY_PASS_NOT_V0_1_RELEASE_CERTIFICATION'
