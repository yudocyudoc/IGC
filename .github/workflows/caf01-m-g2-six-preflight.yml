name: CAF-01 M G2 six — offline tests only, NO solver
on:
  pull_request:
    paths:
      - 'experiments/cafeteria/pc01/caf01_m_g2_six_native.py'
      - 'experiments/cafeteria/pc01/test_caf01_m_g2_six_native.py'
      - '.github/workflows/caf01-m-g2-six.yml'
      - '.github/workflows/caf01-m-g2-six-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight-six-no-solver:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Exercise six synthetic balance receipts and final E1 CAF source checks
        run: |
          set -euo pipefail
          python -m unittest discover -s experiments/cafeteria/pc01 \
            -p 'test_caf01_m_g2_six_native.py' -v
          python -m unittest discover -s experiments/cafeteria/pc01 \
            -p 'test_caf01_m_producer_admission.py' -v
      - name: Produce all nine final CAF models for native CHECK-ONLY
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,"experiments/cafeteria/pc01")
          from caf01_m_g2_six_native import prepare
          m=prepare(Path("artifacts/m-g2-check-only"))
          assert m["native_invocations_at_prepare"]==0
          print("M_G2_CHECK_ONLY_PREPARED_WITHOUT_MANUAL_SCIENTIFIC_DISPATCH")
          PY
          test "$(grep -c 'checkModel(' artifacts/m-g2-check-only/M_CHECK_ONLY.mos)" -eq 9
          if grep -Eq 'simulate\(|buildModel\(' artifacts/m-g2-check-only/M_CHECK_ONLY.mos; then
            exit 1
          fi
      - name: Set up unchanged Modelica libraries for CHECK-ONLY
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e1-home" "$RUNNER_TEMP/e1-libs"
          git clone --quiet --depth 1 --branch v4.0.0 https://github.com/modelica/ModelicaStandardLibrary.git "$RUNNER_TEMP/e1-libs/msl"
          git clone --quiet --depth 1 --branch v2.1.2 https://github.com/modelica-3rdparty/SystemDynamics.git "$RUNNER_TEMP/e1-libs/systemdynamics"
          test -s "$RUNNER_TEMP/e1-libs/msl/LICENSE"
          test -s "$RUNNER_TEMP/e1-libs/systemdynamics/LICENSE"
      - name: Native checkModel of all nine sources (NO simulate)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:$PWD" -w "$PWD" \
            -v "$RUNNER_TEMP/e1-home:/omhome" -e HOME=/omhome \
            -v "$RUNNER_TEMP/e1-libs:/thirdparty:ro" \
            -e OPENMODELICALIBRARY=/thirdparty/msl:/thirdparty/systemdynamics \
            openmodelica/openmodelica:v1.26.5-minimal \
            omc artifacts/m-g2-check-only/M_CHECK_ONLY.mos \
            2>&1 | tee artifacts/m-g2-check-only/check_only.console.txt
          if grep -Eq 'Error:|Failed to load|Class .* not found|Error occurred' artifacts/m-g2-check-only/check_only.console.txt; then exit 1; fi
          test "$(grep -Ec 'Check of CAF01MPreflight\.[^ ]+ completed successfully' artifacts/m-g2-check-only/check_only.console.txt)" -eq 9
          echo "M_G2_NINE_REAL_CHECKMODEL_COMPILED_ZERO_NATIVE_SIMULATIONS"
      - name: Explicitly gate manual one-shot construction and isolate all six sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          s=Path("experiments/cafeteria/pc01/caf01_m_g2_six_native.py").read_text()
          w=Path(".github/workflows/caf01-m-g2-six.yml").read_text()
          ast.parse(s)
          assert "github.run_number == 1" in w and "github.run_attempt == 1" in w
          assert "github.ref == 'refs/heads/main'" in w
          assert "RUN_CAF01_M_SIX_G2_ONCE" in w
          assert "for n in 1 2 3 4 5 6; do" in w
          assert "CAF01_M_G2_OMC_INVOCATION_STARTED" in w
          assert "sudo chown -R" in w
          assert w.index("sudo chown -R")<w.index("python experiments/cafeteria/pc01/caf01_m_g2_six_native.py verify")
          assert "M_G2_@@N@@.console.txt" not in w
          assert "M_negative_control_additional_solver_attempts" in s
          assert "D_or_B_results_read" in s
          print("M_G2_SIX_OFFLINE_MOCKS_NO_NATIVE_SIMULATIONS")
          PY
