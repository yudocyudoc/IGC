name: FM-B5 parameter identifiability under a held-out pulse

on:
  push:
    branches: [fm-b5-parameter-identifiability]
    paths:
      - .github/workflows/fm-b5-parameter-identifiability.yml
      - data/synthetic/fm_b5_identifiability_plan.json
      - poc/short_wrappers/IGCMolecules.mo
      - poc/short_wrappers/provenance.json
      - scripts/fm_b5_parameter_identifiability.py
      - tests/test_fm_b5_parameter_identifiability.py
      - docs/FM_B5_PARAMETER_IDENTIFIABILITY.md
  pull_request:
    branches: [fm-b4-discriminating-perturbation]
    paths:
      - .github/workflows/fm-b5-parameter-identifiability.yml
      - data/synthetic/fm_b5_identifiability_plan.json
      - poc/short_wrappers/IGCMolecules.mo
      - poc/short_wrappers/provenance.json
      - scripts/fm_b5_parameter_identifiability.py
      - tests/test_fm_b5_parameter_identifiability.py
      - docs/FM_B5_PARAMETER_IDENTIFIABILITY.md

permissions:
  contents: read

jobs:
  parameter-identifiability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.16"
      - name: Test the calibration and held-out protocol
        run: python -m unittest discover -s tests -p 'test_fm_b5_parameter_identifiability.py' -v
      - name: Fit both structures to calibration observations and evaluate held-out pulse
        run: |
          mkdir -p artifacts/fm-b5-identifiability
          python scripts/fm_b5_parameter_identifiability.py --plan data/synthetic/fm_b5_identifiability_plan.json --output-dir artifacts/fm-b5-identifiability | tee artifacts/fm-b5-identifiability/run.log
      - name: Upload B5 identifiability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fm-b5-parameter-identifiability
          path: artifacts/fm-b5-identifiability/
          if-no-files-found: error
