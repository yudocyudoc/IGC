name: CAF-02 staged execution gates - public/private firewalls (no DES)
on:
  pull_request:
    paths:
      - 'experiments/cafeteria/pc02/caf02_public_cut_bridge.py'
      - 'experiments/cafeteria/pc02/caf02_private_source_boundary.py'
      - 'experiments/cafeteria/pc02/caf02_k2_adjudicator_boundary.py'
      - 'experiments/cafeteria/pc02/caf02_g2_native_correspondence_plan.py'
      - 'experiments/cafeteria/pc02/test_caf02_public_cut_bridge.py'
      - 'experiments/cafeteria/pc02/test_caf02_private_source_boundary.py'
      - 'experiments/cafeteria/pc02/test_caf02_g2_native_correspondence_plan.py'
      - 'experiments/cafeteria/pc02/CAF02_PREPARACION_EJECUCION_G5_G4A_G4B_K2_2026-10-30.md'
      - '.github/workflows/caf02-staged-execution-firewall-offline.yml'
permissions:
  contents: read
jobs:
  stage-firewall-offline-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Strict masks public G4a and G4b, no K2 truth access
        run: |
          set -euo pipefail
          python -m unittest discover -s experiments/cafeteria/pc02 -p 'test_caf02_public_cut_bridge.py' -v
          python -m unittest discover -s experiments/cafeteria/pc02 -p 'test_caf02_private_source_boundary.py' -v
          python -m unittest discover -s experiments/cafeteria/pc02 -p 'test_caf02_g2_native_correspondence_plan.py' -v
          python experiments/cafeteria/pc02/caf02_g2_native_correspondence_plan.py
          echo 'CAF02_EXECUTION_FIREWALL_STAGING_ONLY_NO_DES_NO_OMC_NO_K2_NO_WITNESS'
