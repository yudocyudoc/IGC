name: F1a LinkML schema
on:
  pull_request:
    branches:
      - main
      - f2-f3-rdf-atms-handoff
    paths:
      - .github/workflows/f1a-linkml-bootstrap.yml
      - requirements-f1a-linkml.lock.txt
      - schema/source/**
      - schema/derived/**
      - data/synthetic/f1a_entity_revision.json
      - data/synthetic/fm_a_structural_candidates.json
      - scripts/validate_fm_a_contract.py
      - docs/FM_A_AUDIT_AND_FEASIBILITY.md
      - docs/ANEXO_PUENTE_MOLECULAR_IGC_FM_v0_2_2026-10-20.md
      - scripts/lock_from_pip_report.py
      - scripts/sbom_from_lock.py
permissions:
  contents: read
jobs:
  linkml-schema:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13.16"
      - name: Install LinkML toolchain from committed hashes
        run: |
          mkdir -p artifacts/f1a
          python -m venv /tmp/igc-linkml-locked
          /tmp/igc-linkml-locked/bin/python -m pip install --require-hashes --no-deps --requirement requirements-f1a-linkml.lock.txt --report artifacts/f1a/linkml-pip-install-report.json
          /tmp/igc-linkml-locked/bin/python scripts/lock_from_pip_report.py artifacts/f1a/linkml-pip-install-report.json --output artifacts/f1a/requirements-f1a-linkml.resolved.lock.txt
          diff -u requirements-f1a-linkml.lock.txt artifacts/f1a/requirements-f1a-linkml.resolved.lock.txt
          /tmp/igc-linkml-locked/bin/python scripts/sbom_from_lock.py requirements-f1a-linkml.lock.txt --output artifacts/f1a/linkml-toolchain.spdx.json
      - name: Generate, compare, and validate LinkML outputs
        run: |
          /tmp/igc-linkml-locked/bin/gen-json-schema schema/source/igc.yaml > artifacts/f1a/igc.schema.json
          /tmp/igc-linkml-locked/bin/gen-json-schema --top-class ClaimOccurrence schema/source/igc.yaml > artifacts/f1a/claim-occurrence.schema.json
          mkdir -p artifacts/f1a/fm-a
          for top_class in ConceptualModelRequest MoleculeDefinition SystemModelCandidate SystemStructureRevision; do
            /tmp/igc-linkml-locked/bin/gen-json-schema --top-class "$top_class" schema/source/igc.yaml > "artifacts/f1a/fm-a/${top_class}.schema.json"
          done
          /tmp/igc-linkml-locked/bin/python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for

          schema = json.loads(Path("artifacts/f1a/claim-occurrence.schema.json").read_text(encoding="utf-8"))
          fixture = json.loads(Path("data/synthetic/f1a_entity_revision.json").read_text(encoding="utf-8"))
          validator = validator_for(schema)
          validator.check_schema(schema)
          errors = sorted(validator(schema).iter_errors(fixture), key=lambda error: list(error.path))
          if errors:
              raise SystemExit("\n".join(error.message for error in errors))
          print("LinkML source parsed; committed JSON Schema matches generator output; synthetic ClaimOccurrence validates.")
          PY
          /tmp/igc-linkml-locked/bin/python scripts/validate_fm_a_contract.py --schema-dir artifacts/f1a/fm-a --check-negative-cases
          diff -u schema/derived/igc.schema.json artifacts/f1a/igc.schema.json
      - name: Upload F1a schema and lock evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: f1a-linkml-evidence
          path: artifacts/f1a/
          if-no-files-found: error
