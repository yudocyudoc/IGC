name: Arena B single-call run status audit
on:
  pull_request:
    branches: [feature/arena-b-native-node-engine-v01]
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect exact authorized commit push run, never invoke provider
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          uri="https://api.github.com/repos/yudocyudoc/IGC/actions/workflows/arena-b-native-revision.yml/runs?per_page=40"
          req=urllib.request.Request(uri,headers={
              "Authorization":"Bearer "+os.environ["GITHUB_TOKEN"],
              "Accept":"application/vnd.github+json",
              "X-GitHub-Api-Version":"2022-11-28"})
          with urllib.request.urlopen(req,timeout=20) as r:
              payload=json.load(r)
          target="0e72d2b3f709f7e72a9b2be3386bf1b7d44a2c48"
          matches=[{"run_id":r["id"],"event":r["event"],"status":r["status"],
                    "conclusion":r.get("conclusion"),"url":r["html_url"],
                    "head_sha":r["head_sha"]}
                   for r in payload["workflow_runs"] if r["head_sha"]==target]
          print("B_SINGLE_CALL_RUNS="+json.dumps(matches,sort_keys=True))
          if not matches:
              raise SystemExit("Authorized push run not found in first 40 runs")
          PY
