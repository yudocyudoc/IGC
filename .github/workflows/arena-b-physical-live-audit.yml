name: Arena B physical one-use push audit (no model calls)
on:
  pull_request:
    branches: [fix/arena-b-g0-native-fidelity-review-20261026]
permissions:
  contents: read
  actions: read
jobs:
  audit-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Audit precisely the marker commit push and real Cloudflare step
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          base='https://api.github.com/repos/yudocyudoc/IGC'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json',
                   'X-GitHub-Api-Version':'2022-11-28'}
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=30) as f:
                  return json.load(f)
          query=base+'/actions/workflows/arena-b-physical-feedback.yml/runs?event=push&per_page=60'
          obj=get(query)
          sha='9edec4aa8c6f1fdb05c763c089489519d9b4e95c'
          runs=[r for r in obj['workflow_runs'] if r['head_sha']==sha]
          print('B_PHYSICAL_PUSH_MATCHES='+json.dumps([
              {'id':r['id'],'status':r['status'],
               'conclusion':r['conclusion'],'url':r['html_url'],
               'head_sha':r['head_sha']} for r in runs],sort_keys=True))
          for run in runs:
              jobs=get(base+'/actions/runs/'+str(run['id'])+'/jobs')
              print('B_PHYSICAL_PUSH_JOBS='+json.dumps([
                  {'name':j['name'],'conclusion':j.get('conclusion'),
                   'steps':[{'name':s['name'],'conclusion':s.get('conclusion')}
                            for s in j.get('steps',[]) if
                            'Gate exactly one' in s['name'] or
                            'Real Cloudflare original Buffalo' in s['name'] or
                            'Adjudicate REAL Buffalo' in s['name']]}
                  for j in jobs['jobs']]))
          if not runs:
              raise SystemExit('NO_RESUMED_PUSH_RUN_FOR_MARKER_COMMIT')
          PY
