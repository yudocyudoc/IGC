name: Arena D2 corrected G2 — simulate revised own models, not evaluator world
on:
  push:
    branches: [fix/arena-d2-revised-modelica-g2-20261026]
  pull_request:
    branches: [feature/arena-d-pure-stockflow-v01]
permissions:
  contents: read
  actions: read
concurrency:
  group: arena-d2-revised-g2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  d2-revised-own-models:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OMC_IMAGE: openmodelica/openmodelica:v1.27.1-minimal@sha256:ac9a0223e69b8055d444b42f58ccb9680342b56848c68b81385bf83d7c0ba824
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore ONLY the actual archived D2 producer evidence, never the evaluator world
        uses: actions/download-artifact@v4
        with:
          name: arena-d-v1-screen-modelica-evidence
          run-id: 40248817463
          github-token: ${{ github.token }}
          path: artifacts/d2-parent
      - name: Verify immutable D-only original parent and run adversarial tests
        run: |
          set -euo pipefail
          python -m py_compile scripts/arena_d2_revised_g2.py tests/test_arena_d2_revised_g2.py
          python -m unittest discover -s tests -p 'test_arena_d2_revised_g2.py' -v
          python -m unittest discover -s tests -p 'test_arena_d_v2_revision.py' -v
          python - <<'PY'
          from pathlib import Path
          from scripts.arena_d2_revised_g2 import read_parent
          parent=Path('artifacts/d2-parent')
          data=read_parent(parent)
          assert len(data[0]['report']['results'])==6
          assert len(data[0]['current_support'])==1
          assert not list(parent.glob('*World*')), 'EVALUATOR_MODEL_LEAKED'
          print('D_ONLY_ORIGINAL_D2_ARTIFACT_AUTHENTICATED_NO_WORLD')
          PY
      - name: Eject exactly six D2 fitted structures from D2 own parameters (G0 preflight)
        run: |
          set -euo pipefail
          python -m scripts.arena_d2_revised_g2 emit \
            --input data/synthetic/arena_d_v01_visible.json \
            --protocol data/synthetic/arena_d_v1_screen_protocol.json \
            --parent-dir artifacts/d2-parent \
            --out artifacts/arena-d2
          test "$(find artifacts/arena-d2 -maxdepth 1 -name 'D2fit_*.mo' | wc -l)" -eq 6
          if grep -l 'D2IndependentWorld' artifacts/arena-d2/*.mo; then
            echo 'EVALUATOR_WORLD_IN_D_GENERATOR' >&2
            exit 1
          fi
      - name: Simulate all six revised OWN D2 Modelica candidates
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/work" -w /work/artifacts/arena-d2 \
            "$OMC_IMAGE" omc d2.mos 2>&1 | tee artifacts/arena-d2/omc.log
          if grep -Eq 'Error:|Failed to load|Class .* not found|Simulation execution failed|Error occurred' artifacts/arena-d2/omc.log; then
            exit 1
          fi
          test "$(find artifacts/arena-d2 -maxdepth 1 -name 'D2fit_*_res.csv' | wc -l)" -eq 6
      - name: Numerical parity and independent mass balance on real D2 revised outputs
        run: |
          set -euo pipefail
          python -m scripts.arena_d2_revised_g2 verify \
            --input data/synthetic/arena_d_v01_visible.json \
            --protocol data/synthetic/arena_d_v1_screen_protocol.json \
            --parent-dir artifacts/d2-parent \
            --manifest artifacts/arena-d2/manifest.json \
            --out artifacts/arena-d2/real-g2-verification.json
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('artifacts/arena-d2')
          result=json.loads((root/'real-g2-verification.json').read_text())
          assert result['models_verified']==6
          assert result['g2_status']=='ALL_REVISED_CANDIDATES_SIMULATED_AND_MASS_BALANCED'
          assert result['heldout_status']=='NOT_RUN'
          assert len(result['current_support'])==1
          for candidate in result['by_candidate'].values():
              assert candidate['g2_mass']['status']=='G2_MASS_BALANCE_PASS_NOT_G3'
              assert candidate['d2_rk4_parity']['status']=='PYTHON_OMC_NUMERICAL_PARITY'
          print('D2_REVISED_G2_ALL_SIX_MODELS_REAL_AND_CONSERVED_NOT_WORLD_OR_G3')
          PY
      - name: Preserve evidence even for failed attempts
        if: always()
        run: |
          if [ -d artifacts/arena-d2 ]; then sudo chown -R "$(id -u):$(id -g)" artifacts/arena-d2; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arena-d2-own-revised-six-openmodelica-g2
          path: artifacts/arena-d2/
          retention-days: 30
          if-no-files-found: warn
