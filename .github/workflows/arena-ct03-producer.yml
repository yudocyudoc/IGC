name: Arena CT-03 | one authorized original producer lot (no evaluator truth)
on:
  workflow_dispatch:
    inputs:
      authorized:
        description: 'Human-approved one CT03 producer lot; not an automatic authorization'
        required: true
        type: choice
        options: ['no', 'yes']
        default: 'no'
      freeze_sha:
        description: 'Full SHA40 of approved protocol and producer code'
        required: true
        type: string
      public_release_run_id:
        description: 'Earlier public-only CT03 intake run (never the private custodian run)'
        required: true
        type: string
      max_new_omc:
        description: 'Exact shared budget, including one already spent private world attempt'
        required: true
        type: number
        default: 0
      max_provider_posts:
        description: 'Exact two-original-Engine.generate-round ceiling'
        required: true
        type: number
        default: 0

permissions:
  contents: read
  actions: read
concurrency:
  group: arena-ct03-unique-live-producer-lot
  cancel-in-progress: false

jobs:
  admit-public-and-budget:
    # Named environment by itself does NOT grant review protection.
    # Independently configure required reviewers and approval variables.
    environment: arena-ct03-producer
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Freeze manual run, prior separate release, exact budget and unique one-shot
        shell: bash
        env:
          AUTH: ${{ inputs.authorized }}
          FROZEN: ${{ inputs.freeze_sha }}
          SOURCE_RUN: ${{ inputs.public_release_run_id }}
          MAX_OMC: ${{ inputs.max_new_omc }}
          MAX_POST: ${{ inputs.max_provider_posts }}
          APPROVED_SHA: ${{ vars.CT03_APPROVED_FREEZE_SHA }}
          APPROVED_RELEASE_RUN: ${{ vars.CT03_APPROVED_RELEASE_RUN_ID }}
          CUSTODIAN_ACK: ${{ vars.CT03_EXTERNAL_CUSTODIAN_ACK }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$GITHUB_REF" = refs/heads/experiment/arena-ct00-ct02-20261107
          test "$AUTH" = yes
          test "$MAX_OMC" = 19
          test "$MAX_POST" = 2
          [[ "$FROZEN" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]*$ ]]
          test "$FROZEN" = "$GITHUB_SHA"
          test -n "$APPROVED_SHA"
          test -n "$APPROVED_RELEASE_RUN"
          test "$APPROVED_SHA" = "$GITHUB_SHA"
          test "$APPROVED_RELEASE_RUN" = "$SOURCE_RUN"
          test "$CUSTODIAN_ACK" = external_private_world_attempted_once
          META="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN")"
          test "$(jq -r '.head_sha' <<< "$META")" = "$FROZEN"
          test "$(jq -r '.event' <<< "$META")" = workflow_dispatch
          test "$(jq -r '.conclusion' <<< "$META")" = success
          test "$(jq -r '.run_attempt' <<< "$META")" = 1
          test "$(jq -r '.path' <<< "$META")" = ".github/workflows/arena-ct03-public-intake.yml"
          test "$(jq -r '.head_branch' <<< "$META")" = experiment/arena-ct00-ct02-20261107
          # A failed producer dispatch might have consumed budget. A NEW
          # dispatch is NOT a retry. No earlier manual run can exist at all.
          PRIOR="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/arena-ct03-producer.yml/runs?event=workflow_dispatch&per_page=100" --jq             "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)] | length" 2>/dev/null || echo ERROR)"
          test "$PRIOR" = 0
          echo "CT03_LOT_MANUAL_GATES_AND_UNIQUE_DISPATCH_OK"
      - name: Download only an earlier 3-file public custody intake artifact
        uses: actions/download-artifact@v4
        with:
          name: arena-ct03-public-release-${{ inputs.public_release_run_id }}
          run-id: ${{ inputs.public_release_run_id }}
          github-token: ${{ github.token }}
          path: artifacts/ct03-public
      - name: Verify only four public cuts and no private file
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          from scripts.arena_cafe.ct03_public_intake import validate,FILES
          root=Path("artifacts/ct03-public")
          assert not any(x.is_symlink() for x in root.rglob("*"))
          files={str(p.relative_to(root)) for p in root.rglob("*") if p.is_file()}
          assert files==FILES, ("CT03_PUBLIC_RELEASE_EXTRA_OR_MISSING",files)
          obj=lambda name:json.loads((root/name).read_text(encoding="utf-8"))
          source=validate(obj("construction.json"),obj("world-commitment.json"),
                          obj("release-status.json"))
          print("CT03_PUBLIC_FOUR_CUTS_VALIDATED_PRIVATE_WORLD_UNAVAILABLE",source)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arena-ct03-public-validated
          path: artifacts/ct03-public/
          if-no-files-found: error
          retention-days: 90

  dm-originals-own-feedback-and-revisions:
    needs: admit-public-and-budget
    environment: arena-ct03-producer
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: arena-ct03-public-validated
          path: artifacts/ct03-public
      - name: Download exact original two CT02 physical consequences (no rerun)
        uses: actions/download-artifact@v4
        with:
          name: arena-ct02-technical-attempt-42409210062
          run-id: 42409210062
          github-token: ${{ github.token }}
          path: artifacts/ct03-reuse/original
      - name: Revalidate original CT02 archive, stage only 10 new originals
        run: |
          set -euo pipefail
          mkdir -p artifacts/ct03-reuse
          python -m scripts.arena_cafe.ct03_reuse_ct02 \
            --original-artifact-dir artifacts/ct03-reuse/original \
            --out artifacts/ct03-reuse/reused-original-two.json
          python -m scripts.arena_cafe.ct03_dm_initial_batch prepare \
            --out artifacts/ct03-producer/dm-ten \
            --reuse-report artifacts/ct03-reuse/reused-original-two.json
      - name: Install pinned original OpenModelica libraries
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e1-libs" "$RUNNER_TEMP/e1-home"
          git clone --quiet --depth 1 --branch v4.0.0 https://github.com/modelica/ModelicaStandardLibrary.git "$RUNNER_TEMP/e1-libs/msl"
          git clone --quiet --depth 1 --branch v2.1.2 https://github.com/modelica-3rdparty/SystemDynamics.git "$RUNNER_TEMP/e1-libs/systemdynamics"
          docker pull openmodelica/openmodelica@sha256:8993c8273224aeacbc018f351c00d60879c5aec386c77a58019318c44c938c9b
      - name: Original ten D/M initial OMC attempts, no retry
        env:
          CT03_LIVE_BATCH_AUTH: CT03_ONE_APPROVED_LOT
          CT03_DM_TEN_AUTH: EXACTLY_TEN_ORIGINAL_INITIALS
          CT03_FROZEN_SHA: ${{ inputs.freeze_sha }}
          CT03_OMC_BUDGET_MAX: '19'
          CT03_OMC_WORLD_ATTEMPTS: '1'
        run: |
          set -euo pipefail
          bash scripts/arena_cafe/ct03_dm_execute_ten_once.sh
      - name: Own construction feedback in original D and M lanes
        run: |
          set -euo pipefail
          python -m scripts.arena_cafe.ct03_dm_feedback_round \
            --ten-root artifacts/ct03-producer/dm-ten \
            --ct02-root artifacts/ct03-reuse/original \
            --reuse-report artifacts/ct03-reuse/reused-original-two.json \
            --construction artifacts/ct03-public/construction.json \
            --recorded-at "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" \
            --out artifacts/ct03-producer/dm-feedback
      - name: Selected original M revisions only, each one OMC maximum
        env:
          CT03_LIVE_BATCH_AUTH: CT03_ONE_APPROVED_LOT
          CT03_M_REVISIONS_AUTH: ORIGINAL_M2_SELECTED_ONLY
          CT03_FROZEN_SHA: ${{ inputs.freeze_sha }}
          CT03_OMC_BUDGET_MAX: '19'
          CT03_OMC_BEFORE_M_REVISIONS: '11'
        run: |
          set -euo pipefail
          bash scripts/arena_cafe/ct03_m_revision_execute_once.sh
      - name: Twelve immutable candidate slots and count-only budget for B
        run: |
          set -euo pipefail
          ROOT=artifacts/ct03-producer
          python -m scripts.arena_cafe.ct03_dm_lock_projection \
            --dm-feedback "$ROOT/dm-feedback/producer-12/dm-feedback-report.json" \
            --d-manifest "$ROOT/dm-ten/D/manifest.json" \
            --m-manifest "$ROOT/dm-ten/M/manifest.json" \
            --revision-outcomes "$ROOT/dm-feedback/producer-12/m-revision-outcomes.json" \
            --out "$ROOT/dm-twelve-lock-rows.json"
          python -m scripts.arena_cafe.ct03_lot_budget issue \
            --dm-report "$ROOT/dm-feedback/producer-12/dm-feedback-report.json" \
            --m-revision-report "$ROOT/dm-feedback/producer-12/m-revision-outcomes.json" \
            --initial-attempt-log "$ROOT/dm-ten/attempts.log" \
            --m-revision-attempt-log "$ROOT/dm-feedback/producer-12/m-revision-attempts.log" \
            --run-id "$GITHUB_RUN_ID" --git-sha "$GITHUB_SHA" \
            --out "$ROOT/dm-budget.json"
      - uses: actions/upload-artifact@v4
        with:
          name: arena-ct03-dm-budget-count-only
          path: artifacts/ct03-producer/dm-budget.json
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: arena-ct03-dm-public-join
          path: |
            artifacts/ct03-producer/dm-twelve-lock-rows.json
            artifacts/ct03-producer/dm-ten/D/manifest.json
            artifacts/ct03-producer/dm-ten/M/manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve D/M attempts, sources, and own feedback separately
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-ct03-dm-raw-one-lot-${{ github.run_id }}
          path: |
            artifacts/ct03-producer/dm-ten/
            artifacts/ct03-producer/dm-feedback/
            artifacts/ct03-producer/dm-twelve-lock-rows.json
            artifacts/ct03-producer/dm-budget.json
          if-no-files-found: warn
          retention-days: 90

  buffalo-original-and-own-review:
    needs: [admit-public-and-budget, dm-originals-own-feedback-and-revisions]
    environment: arena-ct03-producer-b-provider
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/download-artifact@v4
        with:
          name: arena-ct03-public-validated
          path: artifacts/ct03-public
      - uses: actions/download-artifact@v4
        with:
          name: arena-ct03-dm-budget-count-only
          path: artifacts/ct03-budget
      - name: Check count-only shared budget; no D/M model mounted into B
        run: |
          set -euo pipefail
          test -s artifacts/ct03-budget/dm-budget.json
          python -m scripts.arena_cafe.ct03_lot_budget verify \
            --receipt artifacts/ct03-budget/dm-budget.json \
            --construction artifacts/ct03-public/construction.json \
            --run-id "$GITHUB_RUN_ID" --git-sha "$GITHUB_SHA"
          test ! -e artifacts/ct03-producer/dm-ten
          test ! -e artifacts/ct03-producer/dm-feedback
      - name: Fetch pinned unmodified Buffalo quantitative engine
        run: |
          set -euo pipefail
          mkdir -p upstream/sd-ai
          cd upstream/sd-ai
          git init -q
          git remote add origin https://github.com/UB-IAD/sd-ai.git
          git fetch --depth 1 origin 5199f7b45f3a7ae4a773cb0dd8542940aabe9edc
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = 5199f7b45f3a7ae4a773cb0dd8542940aabe9edc
          npm ci --ignore-scripts --omit=optional --no-audit --no-fund
      - name: Install pinned OMC only for possible B original and revised simulations
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e1-libs" "$RUNNER_TEMP/e1-home"
          git clone --quiet --depth 1 --branch v4.0.0 https://github.com/modelica/ModelicaStandardLibrary.git "$RUNNER_TEMP/e1-libs/msl"
          git clone --quiet --depth 1 --branch v2.1.2 https://github.com/modelica-3rdparty/SystemDynamics.git "$RUNNER_TEMP/e1-libs/systemdynamics"
          docker pull openmodelica/openmodelica@sha256:8993c8273224aeacbc018f351c00d60879c5aec386c77a58019318c44c938c9b
      - name: B original and own feedback/currentModel revision, at most two POST
        shell: bash
        env:
          SDAI_ROOT: ${{ github.workspace }}/upstream/sd-ai
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CT03_LIVE_BATCH_AUTH: CT03_ONE_APPROVED_LOT
          CT03_B_PHYSICAL_AUTH: EXACT_ORIGINAL_B_NATIVE_ONCE
          CT03_DM_COUNT_ONLY_BUDGET: artifacts/ct03-budget/dm-budget.json
          CT03_FROZEN_SHA: ${{ inputs.freeze_sha }}
          CT03_OMC_BUDGET_MAX: '19'
          CT03_OMC_WORLD_ATTEMPTS: '1'
          BUFFALO_MODE: live
          BUFFALO_LIVE_AUTH: ONE_UPSTREAM_CALL
          BUFFALO_CT03_LIVE_AUTH: CT03_ONE_ROUND_EXPRESS_AUTH
        run: |
          set -euo pipefail
          bash scripts/arena_cafe/ct03_b_producer_rounds_once.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arena-ct03-b-public-join
          path: artifacts/ct03-producer/B-thirteenth-row.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve original B provider/physical attempt receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arena-ct03-b-raw-one-lot-${{ github.run_id }}
          path: |
            artifacts/ct03-producer/B*/
            artifacts/ct03-producer/b-provider-attempts.log
            artifacts/ct03-producer/b-physical-attempts.log
          if-no-files-found: warn
          retention-days: 90

  join-thirteen-public-slots-no-lock-no-evaluator:
    needs: [admit-public-and-budget, dm-originals-own-feedback-and-revisions, buffalo-original-and-own-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with:
          name: arena-ct03-public-validated
          path: artifacts/ct03-public
      - uses: actions/download-artifact@v4
        with:
          name: arena-ct03-dm-public-join
          path: artifacts/ct03-dm-join
      - uses: actions/download-artifact@v4
        with:
          name: arena-ct03-b-public-join
          path: artifacts/ct03-b-join
      - name: Compose only public five-file freeze bundle from thirteen exact rows
        run: |
          set -euo pipefail
          python -m scripts.arena_cafe.ct03_producer_freeze_handoff \
            --dm-projection artifacts/ct03-dm-join/dm-twelve-lock-rows.json \
            --b-projection artifacts/ct03-b-join/B-thirteenth-row.json \
            --construction artifacts/ct03-public/construction.json \
            --commitment artifacts/ct03-public/world-commitment.json \
            --d-manifest artifacts/ct03-dm-join/dm-ten/D/manifest.json \
            --m-manifest artifacts/ct03-dm-join/dm-ten/M/manifest.json \
            --out artifacts/ct03-final-public
          python - <<'PY'
          from pathlib import Path
          from scripts.arena_cafe.ct03_producer_freeze_handoff import FILES
          p=Path("artifacts/ct03-final-public")
          assert not any(x.is_symlink() for x in p.rglob("*"))
          assert {str(x.relative_to(p)) for x in p.rglob("*") if x.is_file()}==set(FILES)
          assert not (p/"lock.json").exists()
          print("CT03_THIRTEEN_PUBLIC_SLOTS_UNSEALED_AWAIT_INDEPENDENT_ARCHIVE")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arena-ct03-producer-public-and-forecasts
          path: artifacts/ct03-final-public/
          if-no-files-found: error
          retention-days: 90
