name: CAF-02 G2 executable M and D sources - checkModel only (zero simulations)
on:
  pull_request:
    paths:
      - 'experiments/cafeteria/pc02/caf02_g2_native_modelica_sources.py'
      - 'experiments/cafeteria/pc02/caf02_g2_native_executor.py'
      - 'experiments/cafeteria/pc02/caf02_g2_native_correspondence_plan.py'
      - 'experiments/cafeteria/pc02/test_caf02_g2_native_modelica_executor.py'
      - '.github/workflows/caf02-g2-modelica-preflight.yml'
      - '.github/workflows/caf02-g2-native-one-shot.yml'
permissions:
  contents: read
jobs:
  g2-source-unit-and-actual-native-check-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Local model and verifier tests (NO OMC simulation)
        run: |
          set -euo pipefail
          python -m unittest discover -s experiments/cafeteria/pc02 -p 'test_caf02_g2_native_modelica_executor.py' -v
          python -m unittest discover -s experiments/cafeteria/pc02 -p 'test_caf02_g2_native_correspondence_plan.py' -v
          python experiments/cafeteria/pc02/caf02_g2_native_modelica_sources.py prepare --out artifacts/caf02-g2-models
          test "$(find artifacts/caf02-g2-models -name '*.mo' | wc -l)" -eq 15
          test "$(find artifacts/caf02-g2-models -name '*.mos' | wc -l)" -eq 15
      - name: Derive check-only script from EXACT 15 future native MOS scripts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path("artifacts/caf02-g2-models")
          m=json.loads((d/"G2_SOURCE_MANIFEST.json").read_text())
          lines=[]
          for row in m["source_rows"]:
              script=(d/row["mos_file"]).read_text()
              assert script.count("simulate(")==1
              lines += [line for line in script.splitlines()
                        if not line.startswith("simulate(")]
          check="\n".join(lines)+"\n"
          assert "simulate(" not in check
          assert check.count("checkModel(")==15
          (d/"G2_CHECK_ONLY.mos").write_text(check,encoding="utf-8")
          print("CAF02_G2_ONLY_CHECK_MODEL_FIFTEEN_ZERO_NATIVE_SIMULATIONS")
          PY
      - name: Actual OpenModelica checkModel (15 graphs, NO simulation)
        run: |
          set -euo pipefail
          docker pull openmodelica/openmodelica:v1.26.5-minimal
          docker run --rm --network none -v "$PWD:$PWD" -w "$PWD" \
            openmodelica/openmodelica:v1.26.5-minimal \
            omc "$PWD/artifacts/caf02-g2-models/G2_CHECK_ONLY.mos" \
            2>&1 | tee artifacts/caf02-g2-models/G2_CHECK_ONLY.console.txt
          if grep -Eq 'Error:|Failed to load|Class .* not found|Error occurred' \
            artifacts/caf02-g2-models/G2_CHECK_ONLY.console.txt; then
            echo 'CAF02_G2_NATIVE_CHECKMODEL_ERROR' >&2
            exit 1
          fi
          test "$(grep -Ec 'Check of CAF02_.* completed successfully' artifacts/caf02-g2-models/G2_CHECK_ONLY.console.txt)" -eq 15
          echo 'CAF02_G2_15_NATIVE_CHECKMODEL_PASS_ZERO_SIMULATIONS'
      - name: Restore ownership before packaging
        if: always()
        run: |
          if [ -d artifacts/caf02-g2-models ]; then
            sudo chown -R "$(id -u):$(id -g)" artifacts/caf02-g2-models
          fi
      - name: Preserve all generated Modelica sources and check-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CAF02-G2-native-checkModel-only-${{ github.run_id }}
          path: artifacts/caf02-g2-models/
          retention-days: 90
          if-no-files-found: warn
