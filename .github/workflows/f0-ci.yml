name: F0 synthetic spike

on:
  push:
    branches:
      - f0-inventario-spike
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f0-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-spike:
    name: Synthetic spike (Python + OpenModelica)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up OpenModelica
        uses: OpenModelica/setup-openmodelica@v1.2.0
        with:
          version: "1.27.1"
          packages: |
            omc

      - name: Record tool versions
        run: |
          python --version
          omc --version

      - name: Run contract tests
        run: python -m unittest discover -s tests -v

      - name: Run synthetic spike
        id: spike
        continue-on-error: true
        run: python scripts/f0_spike.py

      - name: Require source and OpenModelica stages to pass
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/f0/run.json").read_text(encoding="utf-8"))
          stages = {item["stage"]: item["status"] for item in report["stages"]}
          required = {
              "source_ingest_and_anchor": "PASS",
              "openmodelica_compile_and_simulate": "PASS",
          }
          failures = {
              name: {"expected": expected, "actual": stages.get(name, "MISSING")}
              for name, expected in required.items()
              if stages.get(name) != expected
          }
          print(json.dumps({
              "overall_status": report["overall_status"],
              "required_stages": required,
              "actual_stages": stages,
              "failures": failures,
          }, indent=2))
          if failures:
              raise SystemExit(1)
          PY

      - name: Upload F0 run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f0-spike-evidence
          path: artifacts/f0/
          if-no-files-found: error
