name: F0 synthetic spike

on:
  push:
    branches:
      - f0-inventario-spike
    paths:
      - .github/workflows/f0-ci.yml
      - scripts/**
      - tests/**
      - requirements-f0.txt
      - spike/**
      - data/synthetic/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/f0-ci.yml
      - scripts/**
      - tests/**
      - requirements-f0.txt
      - spike/**
      - data/synthetic/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: f0-spike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-spike:
    name: Synthetic spike (Python + RDF + OpenModelica)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      IGC_OMC_DOCKER_IMAGE: openmodelica/openmodelica:v1.27.1-minimal@sha256:ac9a0223e69b8055d444b42f58ccb9680342b56848c68b81385bf83d7c0ba824
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13.16"

      - name: Resolve F0 dependencies and verify generated hash lock
        run: |
          mkdir -p artifacts/f0
          python -m pip install --requirement requirements-f0.txt --report artifacts/f0/pip-install-report.json
          python scripts/lock_from_pip_report.py artifacts/f0/pip-install-report.json --output artifacts/f0/requirements-f0.resolved.lock.txt
          python -m venv /tmp/igc-f0-lock-verify
          /tmp/igc-f0-lock-verify/bin/python -m pip install --require-hashes --no-deps --requirement artifacts/f0/requirements-f0.resolved.lock.txt --report artifacts/f0/lock-verification-report.json
          python -m pip freeze > artifacts/f0/python-environment.txt

      - name: Record tool versions
        run: |
          python --version
          docker --version
          docker run --rm "${{ env.IGC_OMC_DOCKER_IMAGE }}" omc --version

      - name: Run contract and semantic integration tests
        run: python -m unittest discover -s tests -v

      - name: Run synthetic spike
        id: spike
        continue-on-error: true
        run: python scripts/f0_spike.py

      - name: Require source, semantic, and OpenModelica stages to pass
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/f0/run.json").read_text(encoding="utf-8"))
          stages = {item["stage"]: item["status"] for item in report["stages"]}
          required = {
              "source_ingest_and_anchor": "PASS",
              "web_annotation_jsonld_roundtrip": "PASS",
              "rdf_prov_mapping": "PASS",
              "shacl_positive_and_negative": "PASS",
              "sparql_query": "PASS",
              "crminf_crmsci_mapping": "PASS",
              "atms_reasoning": "PASS",
              "openmodelica_compile_and_simulate": "PASS",
          }
          failures = {
              name: {"expected": expected, "actual": stages.get(name, "MISSING")}
              for name, expected in required.items()
              if stages.get(name) != expected
          }
          print(json.dumps({
              "overall_status": report["overall_status"],
              "required_stages": required,
              "actual_stages": stages,
              "failures": failures,
          }, indent=2))
          if failures:
              raise SystemExit(1)
          PY

      - name: Make Docker evidence readable by artifact uploader
        if: always()
        run: |
          if [ -d artifacts/f0 ]; then
            sudo chown -R "$(id -u):$(id -g)" artifacts/f0
          fi

      - name: Upload F0 run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f0-spike-evidence
          path: artifacts/f0/
          if-no-files-found: error
