name: Arena V0.0 independent arms contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/arena-v0-contract.yml'
      - 'scripts/arena_v0_contract.py'
      - 'tests/test_arena_v0_contract.py'
      - 'docs/ARENA_V0_CONTRACT.md'
      - 'docs/ARENA_P0_BASELINE_2026-10-25.md'
      - 'docs/ARENA_IGC_ATMS_PLAN_IMPLEMENTACION_V1_3_2026-10-25.md'
      - 'README.md'
      - 'ARCHITECTURE_DECISIONS.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/arena-v0-contract.yml'
      - 'scripts/arena_v0_contract.py'
      - 'tests/test_arena_v0_contract.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Checkout the tested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.16'
      - name: Validate syntax and run hermetic tests
        run: |
          python -m py_compile scripts/arena_v0_contract.py tests/test_arena_v0_contract.py
          python -m unittest discover -s tests -p 'test_arena_v0_contract.py' -v
